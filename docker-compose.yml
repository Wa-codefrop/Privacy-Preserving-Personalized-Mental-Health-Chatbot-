services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wellbeing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wellbeing-local}
      POSTGRES_DB: ${POSTGRES_DB:-wellbeing}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wellbeing} -d ${POSTGRES_DB:-wellbeing}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-wellbeing}:${POSTGRES_PASSWORD:-wellbeing-local}@postgres:5432/${POSTGRES_DB:-wellbeing}
      CORS_ORIGINS: '["http://localhost:5173"]'
      DATASET_DIR: /app/datasets
      SESSION_DB_PATH: /app/var/sessions.db
      SAFETY_MODEL_DIR: /app/ml/results
      CHROMA_DB_PATH: /app/knowledge_base/vector_db
      HF_HOME: /app/var/huggingface
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      MAX_HISTORY_TURNS: ${MAX_HISTORY_TURNS:-10}
      RELEVANCE_THRESHOLD: ${RELEVANCE_THRESHOLD:-1.2}
    volumes:
      - ./datasets:/app/datasets:ro
      - ./ml/results:/app/ml/results:ro
      - ./knowledge_base/vector_db:/app/knowledge_base/vector_db
      - ./var:/app/var
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

  streamlit:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["streamlit", "run", "backend/app/ui.py", "--server.address=0.0.0.0", "--server.port=8501"]
    environment:
      API_BASE_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules: